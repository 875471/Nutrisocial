# Integración continua del backend: en cada push y pull request instala dependencias y ejecuta
# las pruebas de backend/test/ con el runner nativo de Node. No despliega nada (Render despliega
# solo desde main por su cuenta); si una prueba falla, el workflow falla.
name: Backend tests

on:
  push:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend-tests.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Las pruebas sustituyen Prisma por un doble en memoria, pero el cliente generado tiene que
      # existir para poder cargar los módulos. No hace falta base de datos.
      - run: npx prisma generate
      - run: node --test "test/*.test.js"
